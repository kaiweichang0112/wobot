        公司：鉅怡智慧股份有限公司
        主要功能：FaceHeart Vitals™ SDK 是一款非接觸式生理資訊量測軟體，透過一般智慧型手機、平板電腦、電腦、智慧電視等裝置的鏡頭，進行約40至60秒的臉部掃描，即可量測心率、心率變異度、血壓、血氧、呼吸頻率、壓力指數等生理數值。
