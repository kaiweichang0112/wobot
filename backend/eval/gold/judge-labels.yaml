        - Unity SDK：使用 Unity 遊戲引擎開發自定義遊戲與應用。

        - BLE 通訊規格：直接透過藍牙協定與控制盒通訊，適合非 Unity 平台的開發。

        Unity SDK：https://docusaurus.seda-gtech.com.tw/docs/whiztoys/software/unity
        BLE 通訊規格：https://docusaurus.seda-gtech.com.tw/docs/whiztoys/hardware/ble-profile
