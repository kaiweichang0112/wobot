    - header: WhizToys 技術文件 › WhizToys 運動地墊遊戲平台總覽
      text: |-
        歡迎使用 WhizToys 運動地墊遊戲平台！這是一款結合「運動地墊」與「數位遊戲」的互動式健身系統，透過精準的壓力感測技術，讓居家運動變得更有趣且具備數據追蹤功能。

        ## 產品核心特點
        一地墊多遊戲：支援多種拼接形狀（如九宮格、長條型），因應不同遊戲需求。
        精準感測：採用高靈敏度壓力感測器，能即時偵測使用者的踩踏位置。
        數據回饋：透過藍牙連接專屬 App，記錄每次運動的表現與成果。
        適合全家大小：包含趣味訓練、燈光互動，以及專為高齡者設計的體適能評估量表。
    - header: WhizToys 技術文件 › WhizToys App 說明 › 與 SDK 開發的關係
