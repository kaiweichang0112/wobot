        簡介：福爾 TD-8255 手指型血氧濃度計測量血氧與脈搏，並具藍牙同步功能，數據可送至App進行健康追蹤。具備LCD顯示、血流指數指示與高準確度，適用於居家監測。操作簡單，並自動關機以節省電力。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 穿戴式生理資訊量測裝置
      text: |-
        產品名稱：DOCTER Watch
        公司：霍恩實業有限公司
        主要功能：DOCTER Watch 是一款專為長者與慢性病患者設計的智慧穿戴裝置，結合多項健康監測功能，提供心率、血壓、血氧、體溫等數據的即時監測。其還具備跌倒偵測、定位追蹤、緊急求救等安全功能，能即時將警報發送給家屬或照護者。此裝置可與手機應用程式連接，實現數據同步與遠程監控，幫助照護者隨時掌握使用者的健康狀況，有效提升居家照護品質。
        使用方式：使用者可將 DOCTER Watch 佩戴於手腕，並確保裝置與皮膚良好接觸。開啟後，裝置會透過藍牙與手機應用程式連接，實現數據同步。使用者可在應用程式中查看心率、血壓、血氧、體溫等生理數據，並設置健康目標。若設備偵測到異常情況，如跌倒或生理數據異常，會自動發送警報至指定聯絡人或照護者，確保使用者安全。裝置設計簡便，適合日常佩戴及長期監測。
        簡介：DOCTER Watch 是一款智慧穿戴裝置，結合心率、血壓、血氧、體溫等健康監測功能，並具備跌倒偵測、定位追蹤、緊急求救等安全功能。透過藍牙與手機應用程式連接，使用者可查看健康數據並進行健康管理。當偵測到異常情況，系統會發送警報至指定聯絡人或照護者，確保使用者的安全。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 穿戴式生理資訊量測裝置
      text: |-
        產品名稱：FORA TM10 穿戴式電子體溫計
        公司：FORA Taiwan 台灣福爾
        主要功能：FORA TM10 是一款專為嬰幼兒設計的穿戴式電子體溫計，具備即時體溫監測功能。使用者只需將溫度感應器固定於寶寶的腋下，透過藍牙連線至 iFORA BM App，即可隨時查看寶寶的體溫變化。該裝置可持續測量體溫，並在體溫異常時發送警示通知，協助家長及時掌握寶寶的健康狀況。
        使用方式：使用者需先將溫度感應器固定於寶寶的腋下，並確保感應器緊貼皮膚。接著，透過藍牙將裝置與 iFORA BM App 連線，開始即時監測體溫。家長可在 App 上查看寶寶的體溫數據，並設定體溫異常警示，以便及時採取措施。建議定期檢查裝置的電池狀況，並保持裝置的清潔，以確保測量準確性。
        簡介：FORA TM10 是一款專為嬰幼兒設計的穿戴式電子體溫計，具備即時體溫監測功能。使用者只需將溫度感應器固定於寶寶的腋下，透過藍牙連線至 iFORA BM App，即可隨時查看寶寶的體溫變化。該裝置可持續測量體溫，並在體溫異常時發送警示通知，協助家長及時掌握寶寶的健康狀況。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
        產品名稱：COMGO心血管AI量測儀
        公司：昌泰科醫股份有限公司
        主要功能：提供非侵入式的心血管健康監測服務。使用者僅需透過 App 進行 2 分鐘的量測，即可獲得醫療級（TFDA 送審中）SPO2、PPG、ECG 等數據，並透過雲端 AI 引擎進行分析。系統會將分析結果以易於理解的評級模式呈現，讓使用者能直觀了解自身的心血管健康狀況，實現隨時隨地的健康管理。
        使用方式：使用者需下載並安裝 COMGO 雲健康 App，並透過 App 註冊帳號。開啟 App 後，按照指示進行 2 分鐘的量測，系統將自動收集 SPO2、PPG、ECG 等數據。量測完成後，數據會透過雲端 AI 引擎進行分析，並以評級模式呈現結果。使用者可隨時查看自己的健康狀況，並根據建議進行相應的健康管理。
        簡介：提供非侵入式的心血管健康監測服務，使用者僅需透過 App 進行 2 分鐘的量測，即可獲得醫療級數據，並透過雲端 AI 引擎進行分析。系統會將分析結果以易於理解的評級模式呈現，讓使用者能直觀了解自身的心血管健康狀況，實現隨時隨地的健康管理。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
        產品名稱：語音臂式血壓計
        公司：福達康科技有限公司
        主要功能：此藍牙傳輸血壓計具備多項先進功能，包括藍牙連接、雙人記憶儲存、最近三次測量平均值、WHO指標顯示、不規則心跳檢測、以及自動關機以延長電池壽命。其設計符合人體工學，操作簡便，適用於家庭與醫療機構使用。藉由藍牙功能，使用者可將測量數據傳輸至智能裝置，方便進行健康管理與記錄。
        使用方式：使用者將血壓計臂帶正確佩戴於上臂，確保臂帶與心臟處於同一水平線。開啟設備後，按下啟動鍵開始測量。測量過程中，請保持靜止並避免交談。完成測量後，裝置會顯示血壓數值，並可透過藍牙將數據傳輸至配對的智能裝置，進行進一步分析與記錄。建議定期進行測量，以監控血壓變化，並依據結果調整生活習慣。
        簡介：此藍牙傳輸血壓計具備藍牙連接、雙人記憶儲存、最近三次測量平均值、WHO指標顯示、不規則心跳檢測等功能。使用者可將測量數據傳輸至智能裝置，方便進行健康管理與記錄。建議定期測量，以監控血壓變化，並依據結果調整生活習慣。
    - header: 產品目錄｜長者日常照顧輔助/安全監測科技產品 › 人員狀態判讀、跌倒偵測、安全防護
      text: |-
        產品名稱：人臉辨識溫度感測系統
        公司：萬博實業股份有限公司
        主要功能：人臉辨識溫度感測系統結合人臉辨識與額溫感測功能。能透過非接觸方式測量體溫並即時辨識身分，適用於門禁與考勤應用。系統提供自動體溫提醒與身份資料比對，強化防疫與安全防控需求。適配多種場域使用，如企業、醫療與公共空間，提高人員進出時的健康監測效率與便利性。
        使用方式：使用者將裝置安裝於進出口或入口處後，系統接通電源並連網。當人經過時，系統自動進行人臉掃描與溫度測量，配合非接觸操作方式，提升人員通過速度與安全感。若偵測到超標體溫或身份異常，系統會即時警示。裝置設計易於整合門禁或考勤系統，並可搭配後端管理平台進行人員進出與體溫資料記錄與分析。
        簡介：人臉辨識溫度感測系統結合人臉辨識與額溫測量，提供非接觸體溫及身份辨識功能，強化防疫與安全管理。安裝後自動偵測通過者，遇異常體溫或身份不符即警示，並可整合門禁/考勤系統，適用於企業、醫療及公共場域，提高健康與通行效率。
