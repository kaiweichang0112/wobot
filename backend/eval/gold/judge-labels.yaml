        簡介：FaceHeart Vitals™ SDK 是一款非接觸式生理資訊量測軟體，透過一般智慧型手機、平板電腦、電腦、智慧電視等裝置的鏡頭，進行約40至60秒的臉部掃描，即可量測心率、心率變異度、血壓、血氧、呼吸頻率、壓力指數等生理數值。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
        產品名稱：TD-8255 指尖脈搏血氧計
        公司：泰博科技股份有限公司
        主要功能：TD-8255 測量血氧飽和度（SpO₂）與脈搏速率（BPM），具藍牙功能，可同步數據至健康追蹤App。配備LCD顯示與五段血流指數（PI）指示，採用雙波長LED技術，測量範圍為 SpO₂ 0% 至 100%、心率 30 至 250 次/分鐘，準確度高，適用於日常健康監控。
