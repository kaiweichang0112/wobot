        ## WhizPad安心臥智慧床墊x安心臥照護系統
        世大智科「安心臥智慧床墊」材質舒適、無需插電使用，搭配「安心臥照護系統」將離床預警、褥瘡防護及睡眠管理合而為一，建立完整科技照護方案。

        ## 溫感釋壓泡綿床墊
        醫學中心實驗證實，降低88%壓傷發生率

        ## 三階段臥離床提醒
        及早發出離床提醒，有效降低88%跌倒發生率

        ## 睡眠活動資料分析
        個人資料長期紀錄，建立精準照護模式

        ## 生理資訊量測紀錄
        藍牙連接量測裝置，App掌握生理資訊

        ## 裝電池的智慧床墊
        不需拉線插電，安全可靠又方便
