    - header: 產品目錄｜長者日常照顧輔助/安全監測科技產品 › 臥床監測、離床預警、壓傷防護
      text: |-
        產品名稱：WhizPad 安心臥智慧床墊
        公司：世大智科股份有限公司
        主要功能：WhizPad 安心臥智慧床墊結合AI與物聯網技術，提供離床預警、壓瘡防護及睡眠管理等功能。床墊內建30個感測區塊，透過類神經網路機器學習，精準判斷使用者的臥床狀態，並提供三階段離床提醒，有效預防跌倒。此外，床墊採用溫感釋壓記憶泡綿材質，提供舒適的睡眠體驗，並可與生理量測裝置連接，實現遠距照護。
        使用方式：使用者只需將WhizPad智慧床墊鋪設於病床上，並確保設備與電源連接。開機後，系統會自動啟動並開始監測使用者的臥床狀態。透過主機上的控制面板，醫護人員可設定翻身角度、翻身方向和翻身停留時間等參數。當發現異常情況時，系統會即時發送通知至照護人員，並提供實時的健康建議。
        簡介：WhizPad 安心臥智慧床墊結合AI與物聯網技術，提供離床預警、壓瘡防護及睡眠管理等功能。床墊內建30個感測區塊，透過類神經網路機器學習，精準判斷使用者的臥床狀態，並提供三階段離床提醒，有效預防跌倒。此外，床墊採用溫感釋壓記憶泡綿材質，提供舒適的睡眠體驗，並可與生理量測裝置連接，實現遠距照護。
