    - header: 產品目錄｜提升長者身體及認知能力科技產品 › 認知訓練/運動遊戲
      text: |-
        產品名稱：WhizToys運動地墊遊戲平台
        公司：世大智科
        主要功能：採用「嚴肅遊戲」的設計理念，將運動與復健內容遊戲化，結合認知訓練、互動競爭及聲光刺激回饋，以提高長者參與活動的意願。產品由9片燈光地墊組成，搭配行動裝置App進行各項遊戲及運動。App內建「趣味復健」、「基本檢測」、「燈光互動」三大類別活動，除了在樂齡照護相關機構、社區活動據點等長者場域使用外，亦可應用在幼兒教育機構運動健身領域。遊戲結果資料儲存於雲端，保障使用者隱私，並可依使用者需求開放查詢。
        使用方式：使用者可透過下載 WhizToys App，搭配實體訓練機進行認知訓練。每次訓練約需10-15分鐘，操作簡單，長者易學快上手。訓練過程中，設備會發出指示，使用者依序按壓對應的按鈕，完成各項認知挑戰。所有訓練數據將上傳至雲端，並由治療師進行分析與回饋，提供個人化建議。此外，使用者可參與線上課程，獲得專業指導與建議，確保訓練效果。
        簡介：WhizToys 運動地墊遊戲平台結合認知訓練、互動競爭及聲光刺激回饋，透過9片燈光地墊與行動裝置App進行遊戲與運動。App內建「趣味復健」、「基本檢測」、「燈光互動」三大類別活動，適用於樂齡照護機構、社區活動據點及幼兒教育機構。遊戲結果資料儲存於雲端，保障使用者隱私，並可依使用者需求開放查詢。
