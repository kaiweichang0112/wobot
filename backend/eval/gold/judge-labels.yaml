    - header: 產品目錄｜長者日常照顧輔助/安全監測科技產品 › 人員狀態判讀、跌倒偵測、安全防護
      text: |-
        產品名稱：OGA雷達毫米波生理感測裝置
        公司：尚茂智能科技股份有限公司
        主要功能：OGA 雷達毫米波生理感測裝置可非接觸式感測人體呼吸與心跳等生理訊號，並具隱私保護優勢，不使用影像偵測。配備毫米波雷達技術，可進行睡眠狀態偵測、跌倒檢測與區域動能分析，其自動告警機制能即時發送 LINE 訊息。此外，所有量測數據均雲端紀錄，支援後續追蹤與分析。此裝置顯著提升照護施設與居家看護的安全管理功能，並以科技取代傳統監控，兼顧隱私與智慧化監護
        使用方式：使用者將 OGA 裝置安置於照護場域如臥床區域或公共空間，接上電源並連結 Wi‑Fi（2.4／5GHz），可在 0–40°C 環境下運作。系統即時感測呼吸與心跳變化，自動識別跌倒與異常動態，當異常觸發即透過 LINE 傳送警示訊息給照護人員。所有數據同步至雲端平台，可隨時回查歷史紀錄以監測身體狀況變化。其零接觸設計使使用時無需改動現場佈置，且具備隱私保護元素，適合居家、醫療與長照場域應用
        簡介：OGA 雷達毫米波生理感測裝置採非接觸毫米波雷達技術，感測呼吸、心跳、睡眠與跌倒狀態，具隱私保護與自動告警功能，並雲端儲存數據。安裝於居家或照護區域後，透過 Wi‑Fi 運作，異常即 LINE 通報，同時可隨時回查雲端紀錄，實現全天候智慧監控。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 穿戴式生理資訊量測裝置
      text: |-
        產品名稱：oCare Pro 100 歐凱腕式血氧飽和測定儀
        公司：臺醫光電科技股份有限公司
        主要功能：居家OSA檢測系統是專為睡眠呼吸中止症（OSA）患者設計的健康監測工具，旨在提供便捷、非侵入式的居家檢測方案。該系統採用先進的生物光子技術，能夠準確監測睡眠過程中的呼吸頻率、血氧飽和度及其他生理指標，並可自動生成檢測報告，幫助醫療人員診斷睡眠障礙。該裝置支援藍牙連接，並可與智慧型手機應用程式同步數據，進行即時健康管理。
        使用方式：使用者需佩戴居家OSA檢測裝置，將其固定在指定部位，並確保裝置與皮膚緊密接觸。啟動裝置後，數據將通過藍牙或無線方式傳送至智慧型手機應用程式，並開始監測睡眠過程中的生理數據。裝置會持續記錄使用者的呼吸狀況、血氧飽和度等，並將結果上傳至應用程式。完成檢測後，使用者可查看詳細的報告，並可將數據分享給醫生進行後續分析與建議。
        簡介：居家OSA檢測系統採用生物光子技術，專為監測睡眠呼吸中止症（OSA）患者設計，能夠準確測量呼吸頻率、血氧等生理數據。數據通過藍牙連接至手機應用程式，使用者可實時查看報告並進行健康管理。檢測結果有助於醫生進行診斷和治療規劃，並支援居家使用。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
        產品名稱：RD-545 十二合一藍牙八點式體組成計
        公司：昌豐國際股份有限公司
        主要功能：採用先進的雙頻量測技術，提供高達 26 項身體組成數據，包括體重、體脂率、體水分率、內臟脂肪、肌肉量、肌肉質量、推定骨量、基礎代謝、體內年齡、體型判定、BMI 及 MBA 判定等。其八點式量測設計，能精確分析全身、左右手臂、左右腿部及軀幹的數據，特別適合健身愛好者、運動員及健康管理者使用。設備支援藍牙連接，可將數據同步至手機應用程式「Health Planet」，方便用戶追蹤健康狀況。
        使用方式：使用者需先在體組成計上設定個人基本資料，包括性別、身高、出生日期等。開機後，選擇對應的使用者編號（最多可設定四位使用者），並確認是否開啟心率測量功能。站上體組成計，手握握把，保持靜止，設備將自動進行測量。測量完成後，數據將顯示於螢幕上，並可透過藍牙同步至手機應用程式「Health Planet」，進行詳細分析與追蹤。建議在相同時間、相同狀態下進行測量，以確保數據的準確性。
        簡介：RD-545 採用雙頻量測技術，提供高達 26 項身體組成數據，並支援藍牙連接手機應用程式「Health Planet」，方便用戶追蹤健康狀況。其八點式量測設計，能精確分析全身、左右手臂、左右腿部及軀幹的數據，特別適合健身愛好者、運動員及健康管理者使用。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
        產品名稱：物聯網穿戴式聽診器
        公司：矽響先創科技股份有限公司
        主要功能：是一款結合穿戴式裝置與物聯網技術的智慧健康產品。透過內建高靈敏度麥克風與感測器，該聽診器可實時收集心肺音訊，並將資料傳輸至雲端平台進行分析。系統可自動識別異常音訊，並提供即時警示，協助醫療人員進行早期診斷。此外，裝置輕巧舒適，適合長時間佩戴，並具備防水設計，適用於多種醫療環境。此產品特別適用於老年人、慢性病患者及高風險族群，協助提升健康管理效率。
        使用方式：使用者只需將物聯網穿戴式聽診器佩戴於胸前，確保裝置與智慧型手機或其他智慧設備連接。開啟配套的應用程式後，系統會自動偵測並記錄心肺音訊。使用者可透過應用程式查看即時數據與歷史紀錄，並根據系統提供的建議進行調整。此外，系統亦可設定提醒功能，當偵測到異常音訊時，會即時通知使用者或相關醫療人員。此裝置亦可與其他健康監測設備整合，提供全面的健康管理方案。
        簡介：物聯網穿戴式聽診器透過內建感測器實時監測心肺音訊，並將數據傳輸至雲端進行分析。使用者只需將裝置佩戴於胸前，並透過配套應用程式查看數據與建議。系統亦可設定提醒功能，協助早期發現異常音訊，特別適用於老年人與慢性病患者。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 穿戴式生理資訊量測裝置
      text: |-
        產品名稱：安麗莎守護天使體溫模組
        公司：台灣安麗莎醫療器材科技股份有限公司
        主要功能：體溫模組提供連續式體溫監測與異常警報通知功能，可應用於全年齡的醫療及居家照護。搭配貼片於腋下持續偵測體溫，並透過無線傳輸技術每秒即時回報數據。當生理訊號超過預設上限或下限時，系統會發出聲音與文字警報，提醒照護者。該模組亦可與血氧模組一起使用，於同一畫面顯示多項生理參數，提供完整健康監控，有效降低感染風險。
        使用方式：安裝流程僅五步驟：先將主機安裝於貼片支架，再撕除貼片背紙，將感測器貼於腋下中央，並以手臂將貼片固定。接著配對手機 App，即可開始測量。模組使用鈕扣電池，可持續監測長達168小時；可調整警報上、下限值，當體溫異常會自動發出警報。搭配可選購之 2 代貼片，具備防水功能，適合多種使用場景，方便易操作，適合居家長期監測。
        簡介：安麗莎守護天使體溫模組可持續監測體溫並於異常時發出聲音與文字警報，適用於各年齡層家庭與醫療照護。使用者將主機與貼片裝配後貼於腋下，並配對 App，即可即時查看溫度變化。鈕扣電池可連續使用168小時，警報設定彈性高，使用流程簡便，是居家健康監控的可靠工具。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 穿戴式生理資訊量測裝置
      text: |-
        產品名稱：健康天使智慧手環
        公司：蓋德科技股份有限公司
        主要功能：健康天使智慧手環是一款智能健康監測設備，具備體溫、心率、血壓、血氧飽和度等多項生理數據監測功能。此手環支援即時數據同步至手機或雲端平台，方便用戶與醫療服務提供者隨時追蹤健康狀況。設備內建AI智能分析，能提供健康建議與預警，對異常數據進行提醒。手環具備長效電池，適合長時間佩戴，並適用於日常運動與健康管理。
        使用方式：使用者可將健康天使智慧手環佩戴在手腕，並進行即時監測。開啟手環後，使用者可選擇測量體溫、心率、血壓、血氧等多項健康指標。數據會通過藍牙同步至手機應用程式或雲端平台，供使用者查看詳細健康報告。手環具有智能預警功能，若檢測到異常數據，會發送提醒通知給使用者。設備適合日常佩戴與健康管理，並可定期檢視測量結果，以便進行生活習慣調整。
        簡介：健康天使智慧手環具備體溫、心率、血壓、血氧等多項健康監測功能。數據即時同步至手機或雲端平台，並可提供健康建議與預警。手環適合日常佩戴，並適用於運動與健康管理。它具備智能預警功能，能提醒使用者注意異常數據。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
        產品名稱：uLife Plus 身心檢測儀
        公司：以明科技股份有限公司
        主要功能：uLife Plus 身心檢測儀是一款可攜式醫用心律儀，專為自律神經分析設計。其主要功能包括單導程心電圖量測、心跳變異（HRV）分析，並可在2.5分鐘內完成測量。產品支援藍牙傳輸，能即時呈現報告，並可採取坐姿或臥姿進行測量。此外，uLife Plus 由台灣研發製造，並獲得衛部醫器製字第006983號認證，確保產品品質與安全性。
        使用方式：使用者可於坐姿或臥姿下，將手指放置於測量區域，啟動設備後，系統將進行約2.5分鐘的測量。測量過程中，設備會自動進行心電圖記錄與心跳變異分析，並透過藍牙將數據傳輸至配套的應用程式。完成測量後，使用者可即時查看分析報告，並根據結果進行後續的健康管理。此設備適用於日常健康監測及自律神經狀態評估。
        簡介：uLife Plus 身心檢測儀是一款可攜式醫用心律儀，專為自律神經分析設計，具單導程心電圖量測與心跳變異（HRV）分析功能。產品支援藍牙傳輸，能即時呈現報告，並可採取坐姿或臥姿進行測量。由台灣研發製造，並獲得衛部醫器製字第006983號認證，確保產品品質與安全性。
    - header: 產品目錄｜遠距生理訊號監測/健康管理平台 › 生理資訊量測設備
      text: |-
