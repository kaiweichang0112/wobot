    - header: 世大智科 G-Tech › WhizPad 安心臥智慧床墊 (2/4)
      text: |-
        經實驗證實 有效降低88％壓傷發生率
        國內醫學中心加護病房招募254名壓傷高危險病 患，分為醫院標準床墊組與活動感知床墊 (WhizPad)組，追蹤病患至出院或轉出ICU。歷 經一年的試驗，壓傷發生率下降88%，延緩壓 傷發生時間近一倍（具有統計學顯著意義）。

        三階段離床提前報知 降低88%離床跌倒發生率
        可設定「躺床→坐床」、「坐床→床緣」、 「床緣→離床」的即時提醒，正確判斷使用者 是否即將離床，預防離床跌倒。
        ・國內醫學中心1300名具跌倒風險患者的實驗證實，與傳統床邊 離床警報墊相比，離床跌倒的可能性降低了88%（P = 0.047）。
        Wen, et. al., (2024) Enhancing Patient Safety Through an Integrated Internet of Things Patient Care System: Large Quasi-Experimental Study on Fall Prevention J Med Internet Res 2024;26:e58380
