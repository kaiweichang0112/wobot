    - header: 徐業良｜Biography
      text: Professor Yeh-Liang Hsu has served 30+ years at Yuan Ze University (YZU), Taiwan,
        where he held various administrative positions. He won many teaching, research, and
        service awards on campus. He was awarded Y. Z. Hsu Chair Professor three times and
        was awarded YZU Distinguished Professor in 2020. Professor Hsu directed his research
        interest in mechanical design to gerontechnology and founded the Gerontechnology Research
        Center (GRC) in 2003, the pioneering research institute in this field in Taiwan. He
        has led the team for many large-scale research projects funded by the government and
        private sectors and has published many papers, books, and patents. Professor Hsu’s
        work in gerontechnology is also well-acknowledged internationally. He was the chairperson
        of the 9th World Conference of the International Society for Gerontechnolgy (ISG)
        in Taipei in 2014/06. He was appointed editor-in-chief of Gerontechnology, the official
        journal of the ISG, in 2016/09. In 2016, Professor Hsu moved one step forward and
        established a start-up company Seda GTech, going from R&D to products for daily applications.
