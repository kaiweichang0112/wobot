        ## 安心臥智慧床墊

        ## 打造最安心的好眠體驗 健康睡眠智慧升級 ＋
        「安心臥智慧床墊」搭配「安心臥照護系統」將離床預警、褥瘡防護及睡眠管理合而為一，以極舒適、非穿非戴的方式結合「AI智慧」 大數據分析進行智能睡眠感知，搭配以「標準物聯網技術」開發的系統平台可以廣泛進行高品質的智慧生活與科技照護應用，實現以床為核心的智能環境。

        及早發現狀況並及時送醫，將遺憾降至最低

        數據為長者代言 精準掌握長者狀況

        特殊溫度感應釋壓記憶泡綿
        床墊採用獨家溫度感應釋壓記憶材質提供良好身形包覆與支撐，讓肌肉與骨骼達到充分地放鬆與保護。
    - header: WhizToys 技術文件 › WhizToys App 說明
      text: |-
        WhizToys App 是運動地墊的專屬控制應用程式，負責藍牙連線、遊戲啟動與數據記錄。

        ## App 下載
        您可以在以下平台搜尋「WhizToys」進行下載：

        平台：Google Play（Android）｜搜尋關鍵字：WhizToys

        平台：App Store（iOS）｜搜尋關鍵字：WhizToys

        ## 登入模式
        App 提供兩種運作模式：

        - 訪客模式：無需註冊，快速開始體驗，但不會保存遊戲紀錄。

        - 帳號登入：可設定多位玩家檔案，長期記錄遊戲數據與健康檢測結果。
    - header: WhizToys 技術文件 › WhizToys App 說明 › 與 SDK 開發的關係
      text: |-
        WhizToys App 是面向一般使用者的產品。如果您是開發者，希望在自己的應用中整合 WhizToys 地墊，請參考以下資源：

        - Unity SDK：使用 Unity 遊戲引擎開發自定義遊戲與應用。

        - BLE 通訊規格：直接透過藍牙協定與控制盒通訊，適合非 Unity 平台的開發。

        Unity SDK：https://docusaurus.seda-gtech.com.tw/docs/whiztoys/software/unity
        BLE 通訊規格：https://docusaurus.seda-gtech.com.tw/docs/whiztoys/hardware/ble-profile
