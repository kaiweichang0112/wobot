    - header: 徐業良｜簡介
      text: 徐業良教授在元智大學服務30餘年，曾擔任多項行政主管職務，多次獲得校內教學、研究、服務獎項，三度獲頒有庠元智講座教授，並在2020年獲頒元智大學特聘教授。徐業良教授於2003年創立元智大學「老人福祉科技(gerontechnology)研究中心」，開創國內在此領域的學術研究，多次領導團隊執行國科會、經濟部、衛福部大型計畫。International
        Society for Gerontechnology (ISG) 1997年在荷蘭創立，徐教授爭取第九屆ISG世界年會於2014/06在台北舉辦，擔任大會主席，2016/09獲選擔任ISG國際學刊Gerontechnology總編輯，廣受國際學者認同。徐教授2015年執行經濟部「產學研價值創造計畫」，在計畫要求下帶領學生團隊成立新創公司「世大智科」，從研究開發進入生活應用，對老人福祉科技產品設計、創新創業有深刻經驗與體會。
