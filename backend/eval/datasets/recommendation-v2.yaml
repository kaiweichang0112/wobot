    expected_behavior: Ask where it is used, or what kind of device is acceptable, or recommend a product with bed-exit alerts.
    # Asking and recommending are both right (person, 2026-10-08): any bed-exit alert fits.
    check:
      kind: recommendation
      action: [replied, recommend]
      recommends: ["WhizPad 安心臥智慧床墊", "iProték 智慧床墊", "美維智慧照護系統", "FusionCare 毫米波雷達基站", "AI-Care 日夜照護安全系統", "ForeAider Z 智慧感知墊", "Pamorcare智慧臥床照護寶", "AI 零接觸智能照護系統", "Monibed 紅外線離床警示器", "AI照護感知系統", "美思臥床照護系統", "毫米波雷達跌倒偵測系統", "南丁格爾智慧照護系統", "奧比森長照輔助系統", "智慧照護解決方案", "家用緊急救援通報系統 HO-140"]
      never: ["Agicare 智能均壓床", "iCue智慧照護幫手", "nFOPT 非侵入性光纖生理監測技術", "OGA雷達毫米波生理感測裝置"]
      prefers: WhizPad 安心臥智慧床墊

