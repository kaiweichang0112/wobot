      recommends: ["iProték 智慧床墊", "美維智慧照護系統", "FusionCare 毫米波雷達基站", "AI-Care 日夜照護安全系統", "ForeAider Z 智慧感知墊", "Pamorcare智慧臥床照護寶", "AI 零接觸智能照護系統"]
      never: ["WhizPad 安心臥智慧床墊", "家用緊急救援通報系統 HO-140", "安照小護士MAX XC‑8000 居家型", "Agicare 智能均壓床", "iCue智慧照護幫手", "nFOPT 非侵入性光纖生理監測技術", "Monibed 紅外線離床警示器", "AI照護感知系統", "智慧照護解決方案"]

