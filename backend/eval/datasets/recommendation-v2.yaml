  - case_id: CASE-023
    scenario: multi_turn_carry
    split: dev
    history:
      - user: 我想找臥床監測產品。
        answer: 好的。請問會在哪裡使用？最在意哪些功能？
    pending_question: 好的。請問會在哪裡使用？最在意哪些功能？
    user_input: 在居家使用，最在意離床提醒，不希望長者配戴裝置。
    expected_behavior: Carry the first turn's need and do not ask again what was answered.
