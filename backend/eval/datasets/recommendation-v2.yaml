# Product recommendation through the ReAct agent (DEC-066): what the turn does with a need,
# and which catalog products may or may never be shown for it.
#   history / pending_question  the conversation before the message, as scripted
#   action      every acceptable outcome: recommend (cards shown), replied (the agent's own
#               words: a question or why nothing fits), or a route other than recommend
#   route       the acceptable routes, when the turn should not recommend at all
#   recommends  every product shown must be one of these
#   never       none of these may be shown
#   prefers     shown first whenever the agent passes it (DEC-065)
#   count       how many products are shown; all means two or more
#   searches    false: the turn must answer without searching
#   language    the reply's language, when not Chinese
#
# Fits are judged from the product catalog alone, as the agent reads it (DEC-066): a
# function must be stated; a constraint may be unstated but not contradicted (DEC-065). A
# product neither fitting nor never is not scored. Questions come from recommendation-v1,
# seed-v1 (CASE-021 to 025) and needs-v1; REC-FX-09 and 10 are new. Labels were proposed by
# AI from the catalog of index version 788 and confirmed by a person on 2026-10-08, who
# decided that only 病床 and 醫護人員 do not tie a product to institutions, while wards,
# institutions or long-term care settings alone do; that 中央監控軟體 is viewing on a
# computer; and that a product shown is not shown again when the user drops a condition.
dataset: recommendation-v2
query_time: "2026-10-08T10:00:00+08:00"
timezone: Asia/Taipei
cases:
  # --- Not enough to search
  - case_id: CASE-021
    scenario: insufficient_need  # REC-FX-02
    split: dev
    user_input: 推薦一個智慧照護產品給我。
    expected_behavior: Ask what the product is for, without searching.
    check: {kind: recommendation, action: [replied], searches: false}
  - case_id: REC-FX-03
    scenario: decisive_difference
    split: dev
    user_input: 我爸最近很容易跌倒，我想找一個照護產品
    expected_behavior: Ask whether a worn device is acceptable, or where it is used, or recommend a product that detects falls.
    # Asking and recommending are both right (person, 2026-10-08): fits as NE-007.
    check:
      kind: recommendation
      action: [replied, recommend]
      recommends: ["AI-Care 日夜照護安全系統", "AI智能照護系統", "FusionCare 毫米波雷達基站", "OGA雷達毫米波生理感測裝置", "毫米波跌倒偵測雷達", "長者照護智慧觀測服務", "Care U 雲端居家照護系統", "JD‑170G 跌倒偵測腕戴呼叫器", "安照小護士MAX XC‑8000 居家型", "DOCTER Watch", "安全天使通話定位健康手錶900Zs", "AI照護感知系統", "毫米波雷達跌倒偵測系統", "智慧照護解決方案"]
      never: ["WhizPad 安心臥智慧床墊", "GaitBEST步態分析軟體", "物聯網智慧鞋墊感測器"]
  - case_id: REC-FX-03B
