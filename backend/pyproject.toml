[project]
name = "wobot"
version = "0.1.0"
description = "Wobot API, agents and jobs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cloud-sql-python-connector[asyncpg]>=1.22.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "google-cloud-storage>=3.15.0",
    "httpx2>=2.13.1",
    "lxml>=6.1.3",
    "openai>=3.22.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wobot-ingest = "wobot.knowledge.cli:main"
wobot-eval = "wobot.eval.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ragas>=0.4.3,<0.5",
    "ruff>=0.16.9",
]

[tool.uv]
# For ragas 0.4.3: it imports a module langchain-community 0.4 removed, and its instructor
# caps jiter below 0.15, which openai 3.4 and later exceed.
constraint-dependencies = ["langchain-community<0.4"]
override-dependencies = ["jiter>=0.16,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
