name: Backend deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits rather than cancelling a deploy halfway.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: test
    # Workload Identity Federation trusts only main; skip rather than fail elsewhere.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC token that Workload Identity Federation exchanges
    env:
      REGION: asia-east1
      IMAGE: asia-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wobot/api:${{ github.sha }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived credentials for wobot-deployer; the runner's gcloud picks them up.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Build and push the image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev
          docker buildx build --platform linux/amd64 --provenance=false --tag "$IMAGE" --push backend

      # Before the API: the running revision must keep working on the new schema.
      - name: Migrate the database
        run: |
          gcloud run jobs update wobot-migrate --image "$IMAGE" --region "$REGION"
          gcloud run jobs execute wobot-migrate --region "$REGION" --wait

      # Only the image and APP_VERSION change; access settings stay as configured.
      - name: Deploy the API
        run: |
          gcloud run deploy wobot-api --image "$IMAGE" --region "$REGION" \
            --update-env-vars "APP_VERSION=$GITHUB_SHA"

      # Fails if traffic is pinned to an older revision after a rollback.
      - name: Check the served version
        run: |
          url=$(gcloud run services describe wobot-api --region "$REGION" --format "value(status.url)")
          version=$(curl --fail --silent --show-error "$url/health" | jq -r .version)
          echo "$url/health reports $version"
          test "$version" = "$GITHUB_SHA"

      # The image only: ingestion runs on its schedule or by hand, never on a deploy.
      - name: Update the ingestion job
        run: |
          gcloud run jobs update wobot-ingest --image "$IMAGE" --region "$REGION" \
            --update-env-vars "APP_VERSION=$GITHUB_SHA"
